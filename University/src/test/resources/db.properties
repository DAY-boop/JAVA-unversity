# 单元测试专用：H2 内存库（MODE=MySQL 保证与生产 DDL 一致）
# 该文件位于 test-classes，会覆盖 main 下的 db.properties
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:university_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=
db.pool.maximumPoolSize=2
db.pool.minimumIdle=1
db.pool.connectionTimeout=3000
db.autoInit=true
