# ============================================================
# 数据库配置（校园二手教材交易系统）
# 修改本文件后重启生效；也可用 -Ddb.url=... 覆盖
# 注：Main.java 启动时默认会通过系统属性覆盖为 H2 内存库，
#     此处配置仅在 WAR 部署到外部 Tomcat 时生效。
# ============================================================

# ---------- 方案 A：H2 内存库（本地开发/IDE 一键启动，默认启用） ----------
db.driver=org.h2.Driver
db.url=jdbc:h2:mem:university;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.username=sa
db.password=

# ---------- 方案 B：H2 文件库（数据持久化，免安装演示用） ----------
# db.driver=org.h2.Driver
# db.url=jdbc:h2:file:./data/university;MODE=MySQL;DB_CLOSE_DELAY=-1
# db.username=sa
# db.password=

# ---------- 方案 C：MySQL 8（正式交付用） ----------
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/university?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
# db.username=root
# db.password=123456

# ---------- 连接池 ----------
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.connectionTimeout=5000
db.pool.idleTimeout=600000

# 启动时是否自动建表并写入种子数据（表已存在则跳过，可安全重复执行）
db.autoInit=true

# 图片上传目录（留空则用 catalina.base/uploads），换成绝对路径更稳妥
upload.dir=
