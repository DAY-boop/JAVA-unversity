<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 · 校园二手教材</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<header id="app-header"></header>

<main class="container">
    <div class="auth-wrap">
        <div class="card">
            <h2>注册</h2>
            <p class="muted" style="margin-top:-6px">注册后即可发布教材、下单购买</p>
            <form id="register-form">
                <div class="form-row">
                    <label>用户名（4-20 位字母、数字或下划线）</label>
                    <input class="input" id="username" required>
                </div>
                <div class="form-row">
                    <label>密码（至少 6 位）</label>
                    <input class="input" id="password" type="password" required>
                </div>
                <div class="form-row">
                    <label>确认密码</label>
                    <input class="input" id="password2" type="password" required>
                </div>
                <div class="form-row">
                    <label>昵称</label>
                    <input class="input" id="nickname" placeholder="不填则默认使用用户名">
                </div>
                <div class="form-grid">
                    <div class="form-row">
                        <label>手机号</label>
                        <input class="input" id="phone" placeholder="选填">
                    </div>
                    <div class="form-row">
                        <label>所在校区</label>
                        <input class="input" id="campus" placeholder="选填">
                    </div>
                </div>
                <button class="btn btn-block" type="submit" id="submit-btn">注册并登录</button>
            </form>
            <p class="muted mt">已有账号？<a href="login.html" style="color:#2563eb">去登录</a></p>
        </div>
    </div>
</main>

<script src="js/app.js"></script>
<script>
    (async function () {
        await renderHeader();
        const form = document.getElementById('register-form');
        const btn = document.getElementById('submit-btn');

        form.onsubmit = async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password !== document.getElementById('password2').value) {
                toast('两次输入的密码不一致', 'error');
                return;
            }
            btn.disabled = true;
            btn.textContent = '提交中…';
            try {
                await api.post('auth/register', {
                    username: document.getElementById('username').value.trim(),
                    password: password,
                    nickname: document.getElementById('nickname').value.trim(),
                    phone: document.getElementById('phone').value.trim(),
                    campus: document.getElementById('campus').value.trim()
                });
                toast('注册成功', 'success');
                setTimeout(() => location.href = 'index.html', 500);
            } catch (err) {
                btn.disabled = false;
                btn.textContent = '注册并登录';
            }
        };
    })();
</script>
</body>
</html>
